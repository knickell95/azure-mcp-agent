name: Deploy to Azure

on:
  push:
    branches: [main, azure-deploy]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/staticwebapp.config.json'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# OIDC requires id-token: write so GitHub can mint a short-lived token that
# Azure trusts without any long-lived client secret.
permissions:
  id-token: write
  contents: read

# ── Configurable values ────────────────────────────────────────────────────────
# APP_NAME drives all resource names in the Bicep templates.
env:
  APP_NAME: azuremcpagent
  RESOURCE_GROUP: rg-azure-mcp-agent
  LOCATION: westus2
  SWA_LOCATION: westus2

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # ── Azure login (OIDC — no stored client secret) ──────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Infrastructure (ACR, Container Apps env, SWA) ─────────────────────────
      # Deploy stable resources that do not depend on the Docker image.
      # The Container App is intentionally excluded here and deployed below,
      # after the image has been built and pushed.
      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

      - name: Deploy infrastructure
        id: infra
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/infra.bicep \
            --parameters \
                appName="$APP_NAME" \
                location="$LOCATION" \
                swaLocation="$SWA_LOCATION" \
            --output json)

          echo "acr_server=$(echo "$OUTPUT" | jq -r '.properties.outputs.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "swa_hostname=$(echo "$OUTPUT" | jq -r '.properties.outputs.swaHostname.value')"  >> "$GITHUB_OUTPUT"

      # ── Backend image ─────────────────────────────────────────────────────────
      - name: Build and push backend image
        env:
          ACR_SERVER: ${{ steps.infra.outputs.acr_server }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          az acr login --name "${APP_NAME}acr"

          # frontend/dist is excluded from the image when deploying to Azure
          # (the frontend goes to SWA); create an empty dir so the Dockerfile
          # COPY succeeds.
          mkdir -p frontend/dist

          docker build \
            --tag "$ACR_SERVER/azure-mcp-agent:$IMAGE_TAG" \
            --file Dockerfile \
            .
          docker push "$ACR_SERVER/azure-mcp-agent:$IMAGE_TAG"

      # ── Container App ─────────────────────────────────────────────────────────
      # Deploy (or update) the Container App now that the image exists in ACR.
      - name: Deploy Container App
        id: app
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/container-app.bicep \
            --parameters \
                appName="$APP_NAME" \
                location="$LOCATION" \
                imageTag="${{ steps.tag.outputs.value }}" \
                anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --output json)

          echo "api_url=$(echo "$OUTPUT"      | jq -r '.properties.outputs.apiUrl.value')"           >> "$GITHUB_OUTPUT"
          echo "identity_id=$(echo "$OUTPUT"  | jq -r '.properties.outputs.identityPrincipalId.value')" >> "$GITHUB_OUTPUT"

      # Assign Reader + Policy Insights Data Reader to the managed identity.
      # "|| true" makes this idempotent — az role assignment create fails if the
      # assignment already exists, which is harmless.
      - name: Assign roles to managed identity
        run: |
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          PRINCIPAL_ID="${{ steps.app.outputs.identity_id }}"
          SCOPE="/subscriptions/$SUBSCRIPTION_ID"

          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "Reader" \
            --scope "$SCOPE" \
            --output none || true

          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "66bb4e9e-b016-4a94-8249-4c0511c2be84" \
            --scope "$SCOPE" \
            --output none || true

      # ── Frontend ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ steps.app.outputs.api_url }}
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Get SWA deployment token
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${APP_NAME}-swa" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Static Web App
        run: |
          npx --yes @azure/static-web-apps-cli@latest deploy frontend/dist \
            --deployment-token "${{ steps.swa-token.outputs.value }}" \
            --env production

      # ── CORS update ───────────────────────────────────────────────────────────
      # Redeploy the Container App with the SWA URL added to ALLOWED_ORIGINS.
      - name: Update backend CORS with SWA URL
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/container-app.bicep \
            --parameters \
                appName="$APP_NAME" \
                location="$LOCATION" \
                imageTag="${{ steps.tag.outputs.value }}" \
                anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
                allowedOrigins="https://${{ steps.infra.outputs.swa_hostname }}" \
            --output none

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        run: |
          {
            echo "## Deployment successful"
            echo ""
            echo "| | URL |"
            echo "|---|---|"
            echo "| **Frontend** | https://${{ steps.infra.outputs.swa_hostname }} |"
            echo "| **Backend API** | ${{ steps.app.outputs.api_url }} |"
            echo ""
            echo "**Image tag:** \`${{ steps.tag.outputs.value }}\`"
            echo ""
            echo "> The Container App scales to 0 — the first request after a period of"
            echo "> inactivity may take 20–30 s while the containers start."
          } >> "$GITHUB_STEP_SUMMARY"

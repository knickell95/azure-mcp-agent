name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/staticwebapp.config.json'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# OIDC requires id-token: write so GitHub can mint a short-lived token that
# Azure trusts without any long-lived client secret.
permissions:
  id-token: write
  contents: read

# ── Configurable values ────────────────────────────────────────────────────────
# Change these to match your preferred resource names / regions.
# APP_NAME drives all resource names in main.bicep (ACR, Container App, SWA…).
env:
  APP_NAME: azuremcpagent
  RESOURCE_GROUP: rg-azure-mcp-agent
  LOCATION: westus2
  SWA_LOCATION: westus2

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # Use the first 12 characters of the commit SHA as the image tag so each
      # deployment is traceable to a specific commit.
      - name: Set image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # ── Azure login (OIDC — no stored client secret) ──────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Infrastructure (Bicep) ────────────────────────────────────────────────
      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

      # First pass: deploy all infrastructure.  On the very first run the
      # Container App will briefly fail to pull its image (the image doesn't
      # exist in ACR yet); the ARM deployment still succeeds and the Container
      # App is healthy after the image push + update steps below.
      - name: Deploy infrastructure
        id: infra
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/main.bicep \
            --parameters \
                appName="$APP_NAME" \
                location="$LOCATION" \
                swaLocation="$SWA_LOCATION" \
                anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
                imageTag="${{ steps.tag.outputs.value }}" \
            --output json)

          echo "api_url=$(echo "$OUTPUT"    | jq -r '.properties.outputs.apiUrl.value')"           >> "$GITHUB_OUTPUT"
          echo "acr_server=$(echo "$OUTPUT" | jq -r '.properties.outputs.acrLoginServer.value')"   >> "$GITHUB_OUTPUT"
          echo "swa_hostname=$(echo "$OUTPUT" | jq -r '.properties.outputs.swaHostname.value')"    >> "$GITHUB_OUTPUT"
          echo "identity_id=$(echo "$OUTPUT" | jq -r '.properties.outputs.identityPrincipalId.value')" >> "$GITHUB_OUTPUT"

      # Assign the Container App's managed identity the roles it needs to read
      # Azure resources.  Using az CLI here avoids a subscription-scoped Bicep
      # module deployment, which would require extra permissions on the SP.
      # "|| true" makes the step idempotent — the command fails if the assignment
      # already exists, which is harmless.
      - name: Assign roles to managed identity
        run: |
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          PRINCIPAL_ID="${{ steps.infra.outputs.identity_id }}"
          SCOPE="/subscriptions/$SUBSCRIPTION_ID"

          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "Reader" \
            --scope "$SCOPE" \
            --output none || true

          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "66bb4e9e-b016-4a94-8249-4c0511c2be84" \
            --scope "$SCOPE" \
            --output none || true

      # ── Backend image ─────────────────────────────────────────────────────────
      - name: Build and push backend image
        env:
          ACR_SERVER: ${{ steps.infra.outputs.acr_server }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          az acr login --name "${APP_NAME}acr"

          # Ensure frontend/dist exists so the Dockerfile COPY doesn't fail.
          # In this deployment the frontend goes to SWA so the directory is empty.
          mkdir -p frontend/dist

          docker build \
            --tag "$ACR_SERVER/azure-mcp-agent:$IMAGE_TAG" \
            --file Dockerfile \
            .
          docker push "$ACR_SERVER/azure-mcp-agent:$IMAGE_TAG"

      # Update the Container App to use the image we just pushed.
      # This creates a new revision and replaces any failed revision from the
      # first Bicep pass (when the image did not yet exist in ACR).
      - name: Update Container App image
        env:
          ACR_SERVER: ${{ steps.infra.outputs.acr_server }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          az containerapp update \
            --name "${APP_NAME}-api" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name backend \
            --image "$ACR_SERVER/azure-mcp-agent:$IMAGE_TAG" \
            --output none

      # ── Frontend ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the React app pointing at the Container App API URL.
      # VITE_API_BASE_URL is baked into the bundle at build time.
      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ steps.infra.outputs.api_url }}
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Get SWA deployment token
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${APP_NAME}-swa" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Static Web App
        run: |
          npx --yes @azure/static-web-apps-cli@latest deploy frontend/dist \
            --deployment-token "${{ steps.swa-token.outputs.value }}" \
            --env production

      # ── CORS update ───────────────────────────────────────────────────────────
      # Second Bicep pass: now that we know the SWA hostname, add it to the
      # backend's ALLOWED_ORIGINS so the browser can reach the API cross-origin.
      - name: Update backend CORS with SWA URL
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deploy/main.bicep \
            --parameters \
                appName="$APP_NAME" \
                location="$LOCATION" \
                swaLocation="$SWA_LOCATION" \
                anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
                imageTag="${{ steps.tag.outputs.value }}" \
                allowedOrigins="https://${{ steps.infra.outputs.swa_hostname }}" \
            --output none

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        run: |
          {
            echo "## Deployment successful"
            echo ""
            echo "| | URL |"
            echo "|---|---|"
            echo "| **Frontend** | https://${{ steps.infra.outputs.swa_hostname }} |"
            echo "| **Backend API** | ${{ steps.infra.outputs.api_url }} |"
            echo ""
            echo "**Image tag:** \`${{ steps.tag.outputs.value }}\`"
            echo ""
            echo "> The Container App scales to 0 — the first request after a period of"
            echo "> inactivity may take 20–30 s while the containers start."
          } >> "$GITHUB_STEP_SUMMARY"
